<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YTFS埋め込み</title>

<link rel="icon" href="../ytst_icon.svg" type="image/svg+xml">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
}

#home {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
}

.box {
    width: min(700px, 90vw);
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>
<body>

<div id="home">
    <div class="box">
        <h1>YTFS埋め込み</h1>

        <div class="input-row">
            <input
                id="url"
                type="text"
                placeholder="YouTubeのURLまたは動画ID"
            >

            <button id="openBtn">
                全画面で開く
            </button>
        </div>
    </div>
</div>

<iframe
    id="player"
    allowfullscreen
    allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
</iframe>

<script>
function extractVideoId(input) {

    input = input.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return input;
    }

    try {

        const url = new URL(input);

        if (url.hostname.includes("youtu.be")) {
            return url.pathname.split("/").filter(Boolean)[0];
        }

        const v = url.searchParams.get("v");
        if (v) return v;

        const paths = url.pathname.split("/").filter(Boolean);

        const embedIndex = paths.indexOf("embed");
        if (embedIndex !== -1) {
            return paths[embedIndex + 1];
        }

        const shortsIndex = paths.indexOf("shorts");
        if (shortsIndex !== -1) {
            return paths[shortsIndex + 1];
        }

        const liveIndex = paths.indexOf("live");
        if (liveIndex !== -1) {
            return paths[liveIndex + 1];
        }

    } catch (e) {}

    return null;
}

function loadVideo(id) {

    document.getElementById("home").style.display = "none";

    const iframe = document.getElementById("player");

    iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);

    iframe.style.display = "block";
}

const params = new URLSearchParams(location.search);
const id = params.get("id");

if (id) {
    loadVideo(id);
}

document.getElementById("openBtn").addEventListener("click", () => {

    const input = document.getElementById("url").value;

    const id = extractVideoId(input);

    if (!id) {
        alert("動画IDを取得できませんでした。");
        return;
    }

    window.open(
        "https://youtube-search-tool.vercel.app/fsembed/?id=" +
        encodeURIComponent(id),
        "_blank"
    );
});
</script>

</body>
</html>
